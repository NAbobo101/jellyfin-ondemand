# secrets.toml — never commit it; chmod 600 (the service refuses to start otherwise).

[jellyfin]
api_key = ""            # Jellyfin: Dashboard → API Keys → +

[qbittorrent]
# Leave empty if the WebUI whitelists the ondemand container's subnet ("Bypass authentication for
# clients in whitelisted IP subnets"). Otherwise one login is made and its cookie reused.
username = ""
password = ""

[subdl]
api_key = ""            # subdl.com → account → API (only with [subtitles] language set)

# One table per provider that needs a secret, named after the provider's `name` in config.toml:
# [providers.my-indexer]
# api_key = ""          # torznab
# [providers.my-unit3d]
# api_token = ""        # unit3d
