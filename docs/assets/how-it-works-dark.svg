troke="#30363d"/><circle cx="954" cy="80" r="17" fill="url(#g)"/><text x="954" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="982" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Press play</text><text x="942" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="16" fill="#8b949e">qBittorrent starts and</text><text x="942" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="16" fill="#8b949e">the gateway streams</text><text x="942" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="16" fill="#8b949e">while it downloads</text><path d="M1046.0 240 v22 H748.0 v-14" fill="none" stroke="#8b949e" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M741.0 254 l7 -9 l7 9" fill="none" stroke="#8b949e" stroke-width="2.5" stroke-linejoin="round"/><text x="897.0" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">seeded and unwatched → torrent deleted, the title stays</text>
